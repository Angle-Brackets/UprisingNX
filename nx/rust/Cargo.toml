[package]
name = "uprising_nx"
version = "0.1.1"
edition = "2021"
publish = false

# The Switch frontend over Zakuro: a staticlib the libnx C shell in ../c links.
[lib]
crate-type = ["staticlib"]

[dependencies]
zakuro-core = { path = "../../zakuro/crates/zakuro-core" }
zakuro-aot = { path = "../../zakuro/crates/zakuro-aot" }
zakuro-fs = { path = "../../zakuro/crates/zakuro-fs" }
zakuro-gpu = { path = "../../zakuro/crates/zakuro-gpu", default-features = false, features = ["vulkan", "jit"] }
zakuro-common = { path = "../../zakuro/crates/zakuro-common" }
log = "0.4"
ab_glyph = "0.2"

[profile.release]
opt-level = 3
panic = "abort"
debug = 1
lto = "fat"
codegen-units = 1

[patch.crates-io]
libc = { path = "../../build/vendor/libc" }
# knows the Switch target, see patches/target-lexicon-switch.patch
target-lexicon = { path = "../../build/vendor/target-lexicon" }
