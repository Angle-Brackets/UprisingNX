name: Test, Version Check, and Tag Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  release:
    types: [created, published, edited]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-version:
    name: Verify VERSION & Release Consistency
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enforce VERSION format, Cargo.toml sync, and release bump
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python3 - <<'PY'
          import os, re, subprocess, sys
          from pathlib import Path

          SEMVER_RE = re.compile(r"^(\d+)\.(\d+)\.(\d+)$")
          CLEAN_TAG_RE = re.compile(r"^v(\d+)\.(\d+)\.(\d+)$")

          def parse_ver(s: str):
              m = SEMVER_RE.match(s.strip())
              if not m:
                  return None
              return tuple(int(g) for g in m.groups())

          def git(*args):
              return subprocess.check_output(["git", *args], text=True).strip()

          ver_raw = Path("VERSION").read_text(encoding="utf-8").strip()
          ver = parse_ver(ver_raw)
          if ver is None:
              sys.exit(f"ERROR: VERSION must be strict MAJOR.MINOR.PATCH semver (got {ver_raw!r})")

          cargo_toml = Path("platforms/nx/rust/Cargo.toml").read_text(encoding="utf-8")
          m_cargo = re.search(r'(?m)^version\s*=\s*"([^"]+)"', cargo_toml)
          if not m_cargo or m_cargo.group(1) != ver_raw:
              found = m_cargo.group(1) if m_cargo else "<missing>"
              sys.exit(
                  f"ERROR: platforms/nx/rust/Cargo.toml version ({found}) does not match VERSION ({ver_raw}). "
                  "Update both files together."
              )

          head_sha = git("rev-parse", "HEAD")
          all_tags = [t for t in git("tag", "-l", "v*").splitlines() if t.strip()]
          clean_tags = []
          for t in all_tags:
              m = CLEAN_TAG_RE.match(t)
              if m:
                  clean_tags.append((tuple(int(g) for g in m.groups()), t))
          clean_tags.sort()

          event = os.environ["EVENT_NAME"]
          ref_type = os.environ["REF_TYPE"]
          ref_name = os.environ["REF_NAME"]
          release_tag = os.environ.get("RELEASE_TAG", "").strip()

          active_tag = None
          if event == "release" and release_tag:
              active_tag = release_tag
          elif ref_type == "tag" and ref_name:
              active_tag = ref_name

          print(f"VERSION={ver_raw} HEAD={head_sha[:7]} event={event} active_tag={active_tag or '-'}")

          if active_tag:
              if active_tag == "snapshots":
                  print("OK: Rolling snapshots archive release.")
              elif CLEAN_TAG_RE.match(active_tag):
                  expected_tag = f"v{ver_raw}"
                  if active_tag != expected_tag:
                      sys.exit(
                          f"ERROR: Release tag {active_tag} does not match VERSION file ({expected_tag}). "
                          "Update VERSION (and platforms/nx/rust/Cargo.toml) before cutting this release."
                      )
                  # Ensure VERSION was strictly bumped compared to all older clean release tags
                  other_tags = [(v, t) for (v, t) in clean_tags if t != active_tag]
                  if other_tags:
                      prev_ver, prev_tag = other_tags[-1]
                      if ver <= prev_ver:
                          sys.exit(
                              f"ERROR: VERSION ({ver_raw}) was not bumped past previous release {prev_tag}. "
                              "Update VERSION before releasing."
                          )
                      prev_file = git("show", f"{prev_tag}:VERSION").strip()
                      if prev_file == ver_raw:
                          sys.exit(
                              f"ERROR: VERSION file is identical to previous release {prev_tag} ({ver_raw}). "
                              "Update VERSION before releasing."
                          )
                  print(f"OK: Clean release tag {active_tag} matches VERSION and is properly bumped.")
              else:
                  # Rolling tag vX.Y.Z-<sha>
                  if not active_tag.startswith(f"v{ver_raw}-"):
                      sys.exit(
                          f"ERROR: Rolling tag {active_tag} does not match VERSION prefix v{ver_raw}-"
                      )
                  print(f"OK: Rolling tag {active_tag} matches VERSION {ver_raw}.")
          else:
              # Branch push / PR / workflow_dispatch:
              # Prevent regressing VERSION below an already-released tag.
              # Note: Cutting a new release tag/GitHub Release (or running scripts/release/release.sh)
              # strictly enforces bumping VERSION past the previous release.
              for tag_ver, tag_name in clean_tags:
                  if tag_ver > ver:
                      sys.exit(
                          f"ERROR: VERSION ({ver_raw}) is older than existing release tag {tag_name}."
                      )
              print(f"OK: VERSION {ver_raw} is valid and matches Cargo.toml.")
          PY

  test:
    name: Desktop Unit Tests
    runs-on: ubuntu-latest
    env:
      RUST_MIN_STACK: "16777216"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libasound2-dev libudev-dev libclang-dev

      - name: Install Rust 1.95
        uses: dtolnay/rust-toolchain@1.95.0

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Run workspace release unit tests
        run: cargo test --workspace --release

  macos-aot-test:
    name: macOS Apple Silicon AOT Tests
    runs-on: macos-15
    env:
      RUST_MIN_STACK: "16777216"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust 1.95
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: aarch64-apple-darwin

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: macos-aot-test

      - name: Run zakuro-aot release tests on Apple Silicon
        run: cargo test -p zakuro-aot --release

  desktop-build:
    name: Desktop Release (${{ matrix.target_name }})
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    needs: [verify-version, test, macos-aot-test]
    env:
      HAS_APPLE_CERT: ${{ secrets.APPLE_CERTIFICATE_P12 != '' && 'true' || 'false' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target_name: linux-x64
            os: ubuntu-latest
            artifact: uprising-recompiled-linux-x64.tar.gz
          - target_name: windows-x64
            os: windows-latest
            artifact: uprising-recompiled-windows-x64.exe
          - target_name: macos-arm64
            os: macos-15
            artifact: uprising-recompiled-macos-arm64.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux system libraries
        if: matrix.target_name == 'linux-x64'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libasound2-dev libudev-dev libclang-dev

      - name: Install MoltenVK (>= 1.3.0)
        if: matrix.target_name == 'macos-arm64'
        run: |
          brew install molten-vk
          MVK_VERSION_LINE="$(brew list --versions molten-vk)"
          echo "Installed MoltenVK: $MVK_VERSION_LINE"
          MVK_PREFIX="$(brew --prefix molten-vk)"
          MVK_DYLIB="$MVK_PREFIX/lib/libMoltenVK.dylib"
          if [[ ! -f "$MVK_DYLIB" ]]; then
            echo "ERROR: Expected libMoltenVK.dylib at $MVK_DYLIB" >&2
            exit 1
          fi
          ls -lhL "$MVK_DYLIB"
          python3 - "$MVK_VERSION_LINE" <<'PY'
          import re, sys
          line = sys.argv[1]
          m = re.search(r"(\d+)\.(\d+)\.(\d+)", line)
          if not m:
              sys.exit(f"ERROR: Could not parse MoltenVK version from {line!r}")
          ver = tuple(int(x) for x in m.groups())
          if ver < (1, 3, 0):
              sys.exit(f"ERROR: MoltenVK >= 1.3.0 required, found {'.'.join(map(str, ver))}")
          print(f"Verified MoltenVK {'.'.join(map(str, ver))} >= 1.3.0")
          PY
          echo "MOLTENVK_DYLIB=$MVK_DYLIB" >> "$GITHUB_ENV"

      - name: Install Rust 1.95
        if: matrix.target_name != 'macos-arm64'
        uses: dtolnay/rust-toolchain@1.95.0

      - name: Install Rust 1.95 (macOS arm64)
        if: matrix.target_name == 'macos-arm64'
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: aarch64-apple-darwin

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target_name }}

      - name: Import Apple Developer ID certificate and notary key
        if: ${{ matrix.target_name == 'macos-arm64' && env.HAS_APPLE_CERT == 'true' }}
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGN_IDENTITY_SECRET: ${{ secrets.APPLE_SIGN_IDENTITY }}
          APPLE_NOTARY_KEY_P8: ${{ secrets.APPLE_NOTARY_KEY_P8 }}
        run: |
          set -euo pipefail
          CERT_PATH="$RUNNER_TEMP/certificate.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"

          printf '%s' "$APPLE_CERTIFICATE_P12" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 \
            -k "$KEYCHAIN_PATH"
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"
          EXISTING_KEYCHAINS=()
          while IFS= read -r kc; do
            kc="$(printf '%s' "$kc" | sed -e 's/^[[:space:]]*//' -e 's/^"//' -e 's/"$//')"
            [[ -n "$kc" ]] && EXISTING_KEYCHAINS+=("$kc")
          done < <(security list-keychains -d user)
          security list-keychains -d user -s "$KEYCHAIN_PATH" "${EXISTING_KEYCHAINS[@]}"
          rm -f "$CERT_PATH"

          IDENTITY="${APPLE_SIGN_IDENTITY_SECRET:-}"
          if [[ -z "$IDENTITY" ]]; then
            IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | awk -F'"' '/Developer ID Application:/ { print $2; exit }')"
          fi
          if [[ -z "$IDENTITY" ]]; then
            echo "ERROR: No Developer ID Application signing identity found in imported certificate." >&2
            security find-identity -v -p codesigning "$KEYCHAIN_PATH" || true
            exit 1
          fi
          echo "APPLE_SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

          if [[ -n "${APPLE_NOTARY_KEY_P8:-}" ]]; then
            NOTARY_KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
            if [[ "$APPLE_NOTARY_KEY_P8" == *"BEGIN PRIVATE KEY"* ]]; then
              printf '%s\n' "$APPLE_NOTARY_KEY_P8" > "$NOTARY_KEY_PATH"
            else
              printf '%s' "$APPLE_NOTARY_KEY_P8" | base64 --decode > "$NOTARY_KEY_PATH"
            fi
            chmod 600 "$NOTARY_KEY_PATH"
            echo "APPLE_NOTARY_KEY_PATH=$NOTARY_KEY_PATH" >> "$GITHUB_ENV"
          fi

      - name: Build stripped Linux x64 binary
        if: matrix.target_name == 'linux-x64'
        run: |
          ./scripts/pc/build-pc.sh
          tar -czf uprising-recompiled-linux-x64.tar.gz -C build/pc uprising-recompiled
          ls -lh uprising-recompiled-linux-x64.tar.gz

      - name: Build static-CRT stripped Windows x64 binary
        if: matrix.target_name == 'windows-x64'
        shell: pwsh
        env:
          RUSTFLAGS: "-C target-feature=+crt-static"
          CARGO_PROFILE_RELEASE_STRIP: "symbols"
        run: |
          cargo build --release -p uprising-recompiled
          Copy-Item target/release/uprising-recompiled.exe uprising-recompiled-windows-x64.exe
          Get-Item uprising-recompiled-windows-x64.exe | Format-List Name, Length

      - name: Build signed macOS arm64 app bundle and DMG
        if: matrix.target_name == 'macos-arm64'
        env:
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER: ${{ secrets.APPLE_NOTARY_ISSUER }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          ./scripts/pc/build-macos.sh --arch arm64
          cp -f build/pc/uprising-recompiled-macos-arm64.dmg uprising-recompiled-macos-arm64.dmg
          ls -lh uprising-recompiled-macos-arm64.dmg

      - name: Clean up temporary Apple signing keychain
        if: ${{ always() && matrix.target_name == 'macos-arm64' && env.HAS_APPLE_CERT == 'true' }}
        run: |
          security delete-keychain "$RUNNER_TEMP/app-signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/certificate.p12" "$RUNNER_TEMP/AuthKey.p8"

      - name: Upload desktop artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

      - name: Attach artifact to GitHub Release (if present)
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.event.release.tag_name || github.ref_name }}
          ARTIFACT: ${{ matrix.artifact }}
        shell: bash
        run: |
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" "$ARTIFACT" --clobber
          else
            echo "No GitHub Release object yet for $TAG_NAME; artifact uploaded to workflow run."
          fi

  tag:
    name: Tag Commit Build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [verify-version, test, macos-aot-test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create and push build tag
        run: |
          VER="$(tr -d ' \r\n' < VERSION)"
          SHORT_SHA="$(git rev-parse --short HEAD)"
          CLEAN_TAG="v${VER}"
          if git rev-parse -q --verify "refs/tags/${CLEAN_TAG}" >/dev/null; then
            echo "Clean release tag ${CLEAN_TAG} already exists; skipping rolling tag until VERSION is bumped."
            {
              echo "### Rolling Tag Skipped"
              echo "- **Version:** \`v${VER}\` was already released (bump \`VERSION\` and \`platforms/nx/rust/Cargo.toml\` for the next release)."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          TAG="v${VER}-${SHORT_SHA}"
          echo "Computed build tag: ${TAG}"
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "Tag ${TAG} already exists; skipping."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "${TAG}" -m "UprisingNX v${VER} (${SHORT_SHA})"
            git push origin "${TAG}"
          fi
          {
            echo "### Build Tagged"
            echo "- **Version:** \`v${VER} (${SHORT_SHA})\`"
            echo "- **Tag:** \`${TAG}\`"
          } >> "$GITHUB_STEP_SUMMARY"
