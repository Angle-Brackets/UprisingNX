<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 526" width="1280" height="526" role="img" aria-label="Kid Icarus: Uprising Recompiled default PC and macOS keyboard, mouse, and gamepad controls">
<defs>
  <style>
    .sans{font-family:Archivo, 'Helvetica Neue', Helvetica, Arial, sans-serif}
    .mono{font-family:'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace}
    .kc{fill:#F2F0EA;stroke:#15171C;stroke-width:1.25}
    .kd{fill:#2A2E36;stroke:#15171C;stroke-width:1.25}
    .ka{fill:#C84630;stroke:#15171C;stroke-width:1.25}
    .kt{font-family:'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace;font-size:10.5px;font-weight:600;fill:#15171C;text-anchor:middle;letter-spacing:0.3px}
    .ktw{font-family:'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace;font-size:10.5px;font-weight:600;fill:#F2F0EA;text-anchor:middle;letter-spacing:0.3px}
    .tp{font-family:Archivo, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:13.5px;font-weight:500;fill:#15171C}
    .ts{font-family:Archivo, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:12.5px;font-weight:400;fill:#6B6E76}
    .pre{font-family:'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace;font-size:11px;font-weight:600;fill:#6B6E76}
    .lbl{font-family:'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace;font-size:11.5px;font-weight:600;fill:#15171C;letter-spacing:1.6px}
    .ld{fill:none;stroke:#8C9099;stroke-width:1;stroke-linejoin:round}
    .bt{fill:#2A2E36;stroke:#15171C;stroke-width:1.3}
    .bl{font-family:'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace;font-size:8.5px;font-weight:600;fill:#F2F0EA;text-anchor:middle}
  </style>
</defs>

<!-- Paper canvas & hairline frame -->
<rect width="1280" height="526" fill="#F2F0EA"/>
<rect x="0.5" y="0.5" width="1279" height="525" fill="none" stroke="#D9D6CD" stroke-width="1"/>

<!-- Section headers -->
<text x="48" y="38" class="lbl">KEYBOARD + MOUSE</text>
<line x1="48" y1="49" x2="612" y2="49" stroke="#15171C" stroke-width="1.5"/>

<line x1="640" y1="30" x2="640" y2="394" stroke="#D9D6CD" stroke-width="1"/>

<text x="668" y="38" class="lbl">GAMEPAD + HID GYRO</text>
<line x1="668" y1="49" x2="1232" y2="49" stroke="#15171C" stroke-width="1.5"/>

<!-- ==================== LEFT HALF: KEYBOARD + MOUSE ==================== -->

<!-- Keyboard cluster -->
<g transform="translate(52,82)">
  <!-- Top utility row -->
  <rect x="0" y="0" width="44" height="30" rx="3" class="kd"/><text x="22" y="19" class="ktw">ESC</text>
  <rect x="64" y="0" width="38" height="30" rx="3" class="kc"/><text x="83" y="19" class="kt">F1</text>
  <rect x="108" y="0" width="42" height="30" rx="3" class="kc"/><text x="129" y="19" class="kt">F11</text>
  <rect x="172" y="0" width="38" height="30" rx="3" class="kc"/><text x="191" y="19" class="kt">P</text>

  <!-- Q W E R T -->
  <rect x="8" y="46" width="38" height="38" rx="3" class="kc"/><text x="27" y="69" class="kt">Q</text>
  <rect x="52" y="46" width="38" height="38" rx="3" class="kd"/><text x="71" y="69" class="ktw">W</text>
  <rect x="96" y="46" width="38" height="38" rx="3" class="kc"/><text x="115" y="69" class="kt">E</text>
  <rect x="140" y="46" width="38" height="38" rx="3" class="ka"/><text x="159" y="69" class="ktw">R</text>
  <rect x="184" y="46" width="38" height="38" rx="3" class="kc"/><text x="203" y="69" class="kt">T</text>

  <!-- A S D F -->
  <rect x="18" y="90" width="38" height="38" rx="3" class="kd"/><text x="37" y="113" class="ktw">A</text>
  <rect x="62" y="90" width="38" height="38" rx="3" class="kd"/><text x="81" y="113" class="ktw">S</text>
  <rect x="106" y="90" width="38" height="38" rx="3" class="kd"/><text x="125" y="113" class="ktw">D</text>
  <rect x="150" y="90" width="38" height="38" rx="3" class="kc"/><text x="169" y="113" class="kt">F</text>

  <!-- SPACE -->
  <rect x="44" y="136" width="144" height="32" rx="3" class="kc"/><text x="116" y="156" class="kt">SPACE</text>
</g>

<!-- Keyboard compact key legend underneath -->
<g transform="translate(52,276)">
  <rect x="0" y="0" width="52" height="20" class="kd"/><text x="26" y="13.8" class="ktw">WASD</text>
  <text x="62" y="14.5" class="tp">Move · Double-tap to dash</text>

  <rect x="0" y="29" width="24" height="20" class="ka"/><text x="12" y="42.8" class="ktw">R</text>
  <text x="34" y="43.5" class="tp">Quick turn · Z-target</text>
  <rect x="182" y="29" width="24" height="20" class="kc"/><text x="194" y="42.8" class="kt">T</text>
  <text x="216" y="43.5" class="tp">Center reticle</text>

  <rect x="0" y="58" width="44" height="20" class="kc"/><text x="22" y="71.8" class="kt">Q / E</text>
  <text x="54" y="72.5" class="tp">Cycle powers</text>
  <rect x="152" y="58" width="24" height="20" class="kc"/><text x="164" y="71.8" class="kt">F</text>
  <text x="186" y="72.5" class="tp">Activate power</text>

  <rect x="0" y="87" width="46" height="20" class="kc"/><text x="23" y="100.8" class="kt">SPACE</text>
  <text x="56" y="101.5" class="tp">Alt fire</text>
  <rect x="118" y="87" width="36" height="20" class="kd"/><text x="136" y="100.8" class="ktw">ESC</text>
  <text x="164" y="101.5" class="tp">Pause &amp; Settings</text>
</g>

<!-- Mouse silhouette -->
<g transform="translate(324,96)">
  <!-- Outer body -->
  <rect x="0" y="0" width="90" height="154" rx="45" fill="#2A2E36" stroke="#15171C" stroke-width="1.6"/>
  <!-- LMB / RMB split -->
  <path d="M 45 0 L 45 64" stroke="#15171C" stroke-width="1.5"/>
  <path d="M 1 64 L 89 64" stroke="#15171C" stroke-width="1.5"/>
  <!-- LMB highlight -->
  <path d="M 44 1.5 L 44 63 L 2 63 L 2 45 A 43 43 0 0 1 44 1.5 Z" fill="#0AB9E6" opacity="0.88"/>
  <!-- RMB subtle shade -->
  <path d="M 46 1.5 L 46 63 L 88 63 L 88 45 A 43 43 0 0 0 46 1.5 Z" fill="#4A505B"/>
  <!-- Scroll wheel -->
  <rect x="38" y="18" width="14" height="32" rx="7" fill="#15171C" stroke="#F2F0EA" stroke-width="1.2"/>
  <line x1="45" y1="24" x2="45" y2="44" stroke="#8C9099" stroke-width="1.2" stroke-dasharray="2,2.5"/>
  <!-- Raw aim crosshair on palm -->
  <g transform="translate(45,112)" stroke="#A3A8B3" fill="none" stroke-width="1.2">
    <circle r="13"/>
    <line x1="-18" y1="0" x2="-7" y2="0"/>
    <line x1="7" y1="0" x2="18" y2="0"/>
    <line x1="0" y1="-18" x2="0" y2="-7"/>
    <line x1="0" y1="7" x2="0" y2="18"/>
    <circle r="2" fill="#FF4554" stroke="none"/>
  </g>
</g>

<!-- Mouse callouts -->
<g>
  <!-- LMB -->
  <polyline points="344,126 344,78 446,78" class="ld"/>
  <rect x="340.5" y="122.5" width="7" height="7" fill="#15171C" stroke="#F2F0EA" stroke-width="1.5"/>
  <rect x="454" y="67" width="36" height="22" class="kc"/><text x="472" y="81.8" class="kt">LMB</text>
  <text x="500" y="82.5" class="tp">Fire / Melee</text>

  <!-- WHEEL -->
  <polyline points="376,128 446,128" class="ld"/>
  <rect x="372.5" y="124.5" width="7" height="7" fill="#15171C" stroke="#F2F0EA" stroke-width="1.5"/>
  <rect x="454" y="117" width="48" height="22" class="kc"/><text x="478" y="131.8" class="kt">WHEEL</text>
  <text x="512" y="132.5" class="tp">Cycle powers</text>

  <!-- RMB / MMB -->
  <polyline points="396,150 422,174 446,174" class="ld"/>
  <rect x="392.5" y="146.5" width="7" height="7" fill="#15171C" stroke="#F2F0EA" stroke-width="1.5"/>
  <rect x="454" y="163" width="36" height="22" class="kc"/><text x="472" y="177.8" class="kt">RMB</text>
  <text x="500" y="178.5" class="tp">Activate power</text>
  <text x="500" y="195.5" class="ts">MMB also activates</text>

  <!-- MOVE MOUSE -->
  <polyline points="384,218 424,234 446,234" class="ld"/>
  <rect x="380.5" y="214.5" width="7" height="7" fill="#15171C" stroke="#F2F0EA" stroke-width="1.5"/>
  <rect x="454" y="223" width="44" height="22" class="kd"/><text x="476" y="237.8" class="ktw">AIM</text>
  <text x="508" y="238.5" class="tp">Direct mouse aim</text>
  <text x="508" y="255.5" class="ts">1:1 reticle &amp; camera</text>
</g>

<!-- ==================== RIGHT HALF: GAMEPAD + HID GYRO ==================== -->

<!-- PS5 DualSense Silhouette (240x186 local, centered at x=948) -->
<g transform="translate(828,118)">
  <!-- L2 / R2 Rear Triggers -->
  <path d="M 38 22 C 40 5 54 2 72 4 L 78 6 L 78 24 L 36 26 Z"
        fill="#15171C" stroke="#15171C" stroke-width="1.3" stroke-linejoin="round"/>
  <path d="M 202 22 C 200 5 186 2 168 4 L 162 6 L 162 24 L 204 26 Z"
        fill="#15171C" stroke="#15171C" stroke-width="1.3" stroke-linejoin="round"/>

  <!-- L1 / R1 Bumpers -->
  <path d="M 28 34 C 34 18 52 14 78 16 L 80 28 L 26 38 Z"
        fill="#4A505B" stroke="#15171C" stroke-width="1.3" stroke-linejoin="round"/>
  <path d="M 212 34 C 206 18 188 14 162 16 L 160 28 L 214 38 Z"
        fill="#4A505B" stroke="#15171C" stroke-width="1.3" stroke-linejoin="round"/>

  <!-- Black lower chin / inner core (classic DualSense two-tone base) -->
  <path d="M 48 26 L 192 26 C 216 32 224 58 228 96 L 232 142 C 234 164 221 178 205 176 C 191 174 181 156 172 136 L 68 136 C 59 156 49 174 35 176 C 19 178 6 164 8 142 L 12 96 C 16 58 24 32 48 26 Z"
        fill="#242830" stroke="#15171C" stroke-width="1.6" stroke-linejoin="round"/>

  <!-- White outer winged shell (DualSense sculpted wrap around grips & shoulder wings) -->
  <path d="M 52 24
           C 64 24 72 25 80 28
           L 86 76
           C 72 80 62 92 60 110
           L 52 146
           C 46 168 38 178 26 176
           C 14 174 6 161 8 140
           L 12 90
           C 15 50 26 24 52 24 Z"
        fill="#FAF9F5" stroke="#15171C" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M 188 24
           C 176 24 168 25 160 28
           L 154 76
           C 168 80 178 92 180 110
           L 188 146
           C 194 168 202 178 214 176
           C 226 174 234 161 232 140
           L 228 90
           C 225 50 214 24 188 24 Z"
        fill="#FAF9F5" stroke="#15171C" stroke-width="1.5" stroke-linejoin="round"/>

  <!-- Subtle grip contour line -->
  <path d="M 19 116 C 18 142 22 162 32 168" fill="none" stroke="#D9D6CD" stroke-width="1.2" stroke-linecap="round"/>
  <path d="M 221 116 C 222 142 218 162 208 168" fill="none" stroke="#D9D6CD" stroke-width="1.2" stroke-linecap="round"/>

  <!-- DualSense trapezoid touchpad + subtle blue lightbar edges -->
  <polygon points="82,27 158,27 152,75 88,75" fill="#F2F0EA" stroke="#15171C" stroke-width="1.35" stroke-linejoin="round"/>
  <line x1="81" y1="29" x2="86.5" y2="73" stroke="#0AB9E6" stroke-width="2" stroke-linecap="round"/>
  <line x1="159" y1="29" x2="153.5" y2="73" stroke="#0AB9E6" stroke-width="2" stroke-linecap="round"/>

  <!-- Gyro emblem centered on touchpad -->
  <g transform="translate(120,47)" fill="none" stroke="#4A505B">
    <circle r="10.5" stroke-width="1.15"/>
    <ellipse rx="10.5" ry="3.8" stroke-width="0.95"/>
    <ellipse rx="3.8" ry="10.5" stroke-width="0.95"/>
    <rect x="-1.8" y="-1.8" width="3.6" height="3.6" fill="#FF4554" stroke="none"/>
  </g>
  <text x="120" y="69" class="mono" font-size="6.8" font-weight="600" fill="#4A505B" text-anchor="middle" letter-spacing="1.4">GYRO</text>

  <!-- Create (left) & Options (right) slim angled pills -->
  <rect x="69" y="34" width="5.5" height="12" rx="2.75" transform="rotate(-10 71.75 40)" fill="#E4E1D8" stroke="#15171C" stroke-width="1"/>
  <rect x="165.5" y="34" width="5.5" height="12" rx="2.75" transform="rotate(10 168.25 40)" fill="#E4E1D8" stroke="#15171C" stroke-width="1"/>

  <!-- Split PlayStation D-Pad (upper-left white face, centered at 46,66) -->
  <g transform="translate(46,66)" fill="#E8E6E0" stroke="#15171C" stroke-width="1.15" stroke-linejoin="round">
    <!-- Up -->
    <path d="M -5.5 -19 L 5.5 -19 L 5.5 -9 L 0 -4 L -5.5 -9 Z"/>
    <!-- Down -->
    <path d="M -5.5 19 L 5.5 19 L 5.5 9 L 0 4 L -5.5 9 Z"/>
    <!-- Left -->
    <path d="M -19 -5.5 L -19 5.5 L -9 5.5 L -4 0 L -9 -5.5 Z"/>
    <!-- Right -->
    <path d="M 19 -5.5 L 19 5.5 L 9 5.5 L 4 0 L 9 -5.5 Z"/>
  </g>

  <!-- PlayStation Face Buttons (upper-right white face, centered at 194,66) -->
  <g transform="translate(194,66)">
    <!-- Triangle (top) -->
    <circle cx="0" cy="-16" r="7.4" fill="#FAF9F5" stroke="#15171C" stroke-width="1.15"/>
    <polygon points="0,-20 3.7,-13.6 -3.7,-13.6" fill="none" stroke="#15171C" stroke-width="1.15" stroke-linejoin="round"/>
    <!-- Square (left) -->
    <circle cx="-16" cy="0" r="7.4" fill="#FAF9F5" stroke="#15171C" stroke-width="1.15"/>
    <rect x="-19.2" y="-3.2" width="6.4" height="6.4" fill="none" stroke="#15171C" stroke-width="1.15"/>
    <!-- Circle (right) -->
    <circle cx="16" cy="0" r="7.4" fill="#FAF9F5" stroke="#15171C" stroke-width="1.15"/>
    <circle cx="16" cy="0" r="3.6" fill="none" stroke="#15171C" stroke-width="1.15"/>
    <!-- Cross (bottom) -->
    <circle cx="0" cy="16" r="7.4" fill="#FAF9F5" stroke="#15171C" stroke-width="1.15"/>
    <path d="M -3.1 12.9 L 3.1 19.1 M 3.1 12.9 L -3.1 19.1" stroke="#15171C" stroke-width="1.2" stroke-linecap="round"/>
  </g>

  <!-- Symmetrical DualSense Analog Sticks (L3 & R3 inside black chin) -->
  <circle cx="85" cy="106" r="17.5" fill="#15171C" stroke="#4B505A" stroke-width="1.2"/>
  <circle cx="85" cy="106" r="12" fill="#2A2E36" stroke="#5E626B" stroke-width="1"/>
  <text x="85" y="109" class="bl">L3</text>

  <circle cx="155" cy="106" r="17.5" fill="#15171C" stroke="#4B505A" stroke-width="1.2"/>
  <circle cx="155" cy="106" r="12" fill="#2A2E36" stroke="#5E626B" stroke-width="1"/>
  <text x="155" y="109" class="bl">R3</text>

  <!-- Center speaker dots + PS button + mute bar -->
  <circle cx="116" cy="86" r="0.9" fill="#6B6E76"/><circle cx="120" cy="86" r="0.9" fill="#6B6E76"/><circle cx="124" cy="86" r="0.9" fill="#6B6E76"/>
  <circle cx="118" cy="89" r="0.9" fill="#6B6E76"/><circle cx="122" cy="89" r="0.9" fill="#6B6E76"/>
  <circle cx="120" cy="104" r="5" fill="#15171C" stroke="#4B505A" stroke-width="1"/>
  <rect x="115" y="116" width="10" height="2.4" rx="1.2" fill="#4A505B"/>
</g>

<!-- Gamepad Left Callouts -->
<g>
  <!-- L1 / L2 (LB / LT) -->
  <polyline points="882,134 854,102 820,102" class="ld"/>
  <rect x="878.5" y="130.5" width="7" height="7" fill="#15171C" stroke="#F2F0EA" stroke-width="1.5"/>
  <rect x="748" y="91" width="64" height="22" class="kc"/><text x="780" y="105.8" class="kt">L1 · L2</text>
  <text x="738" y="106.5" class="tp" text-anchor="end">Fire / Melee</text>
  <text x="738" y="123.5" class="ts" text-anchor="end">LB/LT · L/ZL</text>

  <!-- D-PAD -->
  <polyline points="856,184 820,184" class="ld"/>
  <rect x="852.5" y="180.5" width="7" height="7" fill="#15171C" stroke="#F2F0EA" stroke-width="1.5"/>
  <rect x="764" y="173" width="48" height="22" class="kc"/><text x="788" y="187.8" class="kt">D-PAD</text>
  <text x="754" y="188.5" class="tp" text-anchor="end"><tspan class="pre">◀ ▶</tspan><tspan dx="5">Power</tspan></text>
  <text x="754" y="206.5" class="ts" text-anchor="end"><tspan class="pre">▼</tspan><tspan dx="5">Activate</tspan></text>

  <!-- L-STICK -->
  <polyline points="896,226 844,274 820,274" class="ld"/>
  <rect x="892.5" y="222.5" width="7" height="7" fill="#15171C" stroke="#F2F0EA" stroke-width="1.5"/>
  <rect x="750" y="263" width="62" height="22" class="kc"/><text x="781" y="277.8" class="kt">L-STICK</text>
  <text x="740" y="278.5" class="tp" text-anchor="end">Move · Dash</text>
  <text x="740" y="296.5" class="ts" text-anchor="end"><tspan class="pre">L3</tspan><tspan dx="5">Center cam</tspan></text>
</g>

<!-- Gamepad Right Callouts -->
<g>
  <!-- R2 (RT / ZR) -->
  <polyline points="1012,126 1040,92 1068,92" class="ld"/>
  <rect x="1008.5" y="122.5" width="7" height="7" fill="#15171C" stroke="#F2F0EA" stroke-width="1.5"/>
  <rect x="1076" y="81" width="32" height="22" class="kc"/><text x="1092" y="95.8" class="kt">R2</text>
  <text x="1118" y="96.5" class="tp">Fire / Melee</text>
  <text x="1118" y="113.5" class="ts">RT · ZR</text>

  <!-- R1 (RB / R) -->
  <polyline points="1024,142 1048,142 1068,142" class="ld"/>
  <rect x="1020.5" y="138.5" width="7" height="7" fill="#15171C" stroke="#F2F0EA" stroke-width="1.5"/>
  <rect x="1076" y="131" width="32" height="22" class="ka"/><text x="1092" y="145.8" class="ktw">R1</text>
  <text x="1118" y="146.5" class="tp">Z-Target</text>
  <text x="1118" y="163.5" class="ts">Quick turn · Air recenter</text>

  <!-- Triangle / Y -->
  <polyline points="1030,168 1052,202 1068,202" class="ld"/>
  <rect x="1026.5" y="164.5" width="7" height="7" fill="#15171C" stroke="#F2F0EA" stroke-width="1.5"/>
  <rect x="1076" y="191" width="38" height="22" class="kc"/><text x="1095" y="205.8" class="kt">△/Y</text>
  <text x="1124" y="206.5" class="tp">Center reticle</text>
  <text x="1124" y="224.5" class="ts">✕ Confirm · ○ Back</text>

  <!-- R-STICK -->
  <polyline points="998,236 1042,276 1068,276" class="ld"/>
  <rect x="994.5" y="232.5" width="7" height="7" fill="#15171C" stroke="#F2F0EA" stroke-width="1.5"/>
  <rect x="1076" y="265" width="62" height="22" class="kc"/><text x="1107" y="279.8" class="kt">R-STICK</text>
  <text x="1148" y="280.5" class="tp">Aim / Cam</text>
  <text x="1076" y="304.5" class="ts"><tspan class="pre">R1+flick</tspan><tspan dx="5">Switch target</tspan></text>
</g>

<!-- ==================== BOTTOM 3-COLUMN BAR ==================== -->
<text x="48" y="430" class="lbl">NATIVE HID GYRO</text>
<line x1="48" y1="443" x2="416" y2="443" stroke="#15171C" stroke-width="1.5"/>
<text x="48" y="468.5" class="tp">DualSense · DualShock 4 · Switch Pro · Steam Deck</text>
<text x="48" y="487.5" class="ts">Direct HID motion aiming · Hold R1/RB, △/Y, or L3 to pause</text>

<text x="456" y="430" class="lbl">DESKTOP HOTKEYS</text>
<line x1="456" y1="443" x2="824" y2="443" stroke="#15171C" stroke-width="1.5"/>
<text x="456" y="468.5" class="tp">Esc Pause/Settings · F11 Fullscreen · F1 Mouse</text>
<text x="456" y="487.5" class="ts">P = 3DS Start · Start/Options on controller</text>

<text x="864" y="430" class="lbl">CONTROLLER PROFILES</text>
<line x1="864" y1="443" x2="1232" y2="443" stroke="#15171C" stroke-width="1.5"/>
<text x="864" y="468.5" class="tp">Auto Xbox / PlayStation / Nintendo glyphs</text>
<text x="864" y="487.5" class="ts">Live stick &amp; deadzone scopes in Settings → Controller</text>
</svg>
