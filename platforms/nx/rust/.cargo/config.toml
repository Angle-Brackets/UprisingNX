# Rust std on Horizon over devkitA64's newlib. Recipe from FlashNX (MIT,
# github.com/Jonathan8520/FlashNX rust/.cargo/config.toml): the upstream
# freestanding target lacks target-family=unix, env=newlib and thread-local
# support, so those cfgs are forced and std is built from source.
[build]
target = "aarch64-nintendo-switch-freestanding"
rustflags = [
    "-C", "target-cpu=cortex-a57",
    "-C", "force-frame-pointers=yes",
    "--cfg", "target_family=\"unix\"",
    "--cfg", "target_env=\"newlib\"",
    "--cfg", "unix",
    "-A", "explicit_builtin_cfgs_in_flags",
    "-Z", "has-thread-local=true",
]

[unstable]
build-std = ["std", "panic_abort", "core", "alloc", "compiler_builtins"]

[env]
CARGO_CFG_TARGET_ENV = { value = "newlib", force = true }
